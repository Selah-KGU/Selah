name: Release

on:
  workflow_dispatch:
    inputs:
      major_minor:
        description: "主版本号.副版本号 (例 1.0)。留空则使用 package.json 当前的 major.minor。"
        required: false
        default: ""

concurrency:
  group: updater-draft-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.versions.outputs.version }}
      tag: ${{ steps.versions.outputs.tag }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute release version
        id: versions
        shell: bash
        env:
          MAJOR_MINOR: ${{ inputs.major_minor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${MAJOR_MINOR}" ]; then
            VERSION_JSON=$(node scripts/resolve-release-version.mjs --base "${MAJOR_MINOR}" --github --json)
          else
            VERSION_JSON=$(node scripts/resolve-release-version.mjs --github --json)
          fi
          VERSION=$(node -e 'const data = JSON.parse(process.argv[1]); console.log(data.version)' "$VERSION_JSON")
          TAG=$(node -e 'const data = JSON.parse(process.argv[1]); console.log(data.tag)' "$VERSION_JSON")
          REASON=$(node -e 'const data = JSON.parse(process.argv[1]); console.log(data.reason)' "$VERSION_JSON")
          DATE_FLOOR=$(node -e 'const data = JSON.parse(process.argv[1]); console.log(data.dateFloor)' "$VERSION_JSON")
          echo "Computed version: ${VERSION} (${REASON}, date floor ${DATE_FLOOR})"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Reset existing draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.versions.outputs.tag }}
        run: |
          set -euo pipefail
          if node scripts/find-release-by-tag.mjs --tag "${TAG}" --output release.json; then
            :
          else
            status=$?
            if [ "$status" != "2" ]; then
              exit "$status"
            fi
            tag_ref="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"
            curl -sS -o /tmp/delete-tag.out -w "%{http_code}" -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "$tag_ref" | grep -Eq '^(204|404|422)$'
            echo "No existing release for ${TAG}"
            exit 0
          fi
          node <<'NODE' > release-meta.env
          import fs from "node:fs";
          const release = JSON.parse(fs.readFileSync("release.json", "utf8"));
          console.log(`id=${release.id}`);
          console.log(`draft=${release.draft ? "true" : "false"}`);
          console.log(`url=${release.html_url || ""}`);
          NODE
          source release-meta.env
          if [ "$draft" != "true" ]; then
            echo "Release ${TAG} is already published: ${url}. The resolver should have selected a newer patch, so leaving it untouched."
            exit 0
          fi
          curl -fsSL -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${id}"
          tag_ref="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"
          curl -sS -o /tmp/delete-tag.out -w "%{http_code}" -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "$tag_ref" | grep -Eq '^(204|404|422)$'
          echo "Deleted existing draft release for ${TAG}"

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ steps.versions.outputs.tag }}
        run: |
          set -euo pipefail
          PREV=$(git tag -l 'v*' --sort=-version:refname | grep -v "^${TAG}$" | head -n1 || true)
          if [ -n "${PREV}" ]; then
            LOG=$(git log "${PREV}..HEAD" --no-merges --pretty=format:'- %s (%h)' || true)
            HEADER="## Changes since ${PREV}"
          else
            LOG=$(git log --no-merges --pretty=format:'- %s (%h)' || true)
            HEADER="## Commit history"
          fi
          if [ -z "${LOG}" ]; then
            LOG="- (no new commits)"
          fi
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "${HEADER}"
            echo ""
            echo "${LOG}"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  release-macos:
    needs: prepare
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Apply release version
        run: node scripts/apply-version.mjs ${{ needs.prepare.outputs.version }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build sherpa-onnx universal shared runtime
        run: |
          ./scripts/build-macos-sherpa-runtime.sh \
            --lib-dir /tmp/sherpa-universal-lib \
            --framework-dir "$PWD/src-tauri/macos-runtime"

      - name: Verify updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required to publish updater artifacts."
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/developer-id.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/developer-id.p12"
          echo "SELAH_CODESIGN_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build and publish macOS release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SHERPA_ONNX_LIB_DIR: /tmp/sherpa-universal-lib
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "Selah ${{ needs.prepare.outputs.tag }}"
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target universal-apple-darwin --features stt-shared,self-updater --config '{"bundle":{"createUpdaterArtifacts":true,"macOS":{"entitlements":"Entitlements.DeveloperID.plist","frameworks":["macos-runtime/libsherpa-onnx-c-api.dylib","macos-runtime/libonnxruntime.1.24.4.dylib","lib/libpdfium.dylib","lib/libselah_apple_ai.dylib","lib/libselah_widget.dylib"]},"targets":["dmg","app"]}}' -- --no-default-features

      - name: Verify macOS updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f "src-tauri/target/universal-apple-darwin/release/bundle/macos/Selah.app.tar.gz"
          test -f "src-tauri/target/universal-apple-darwin/release/bundle/macos/Selah.app.tar.gz.sig"
          test -f "latest.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const feed = JSON.parse(fs.readFileSync("latest.json", "utf8"));
          const required = ["darwin-aarch64", "darwin-x86_64", "darwin-aarch64-app", "darwin-x86_64-app"];
          for (const key of required) {
            const item = feed.platforms?.[key];
            if (!item?.url || !item?.signature) {
              throw new Error(`latest.json missing ${key} url/signature`);
            }
          }
          NODE

  release-windows:
    needs: [prepare, release-macos]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          path: s

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: s/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Apply release version
        working-directory: s
        run: node scripts/apply-version.mjs ${{ needs.prepare.outputs.version }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: s

      - name: Shorten temp paths
        run: |
          New-Item -ItemType Directory -Force -Path "D:\tmp" | Out-Null
          echo "TMP=D:\tmp" >> $env:GITHUB_ENV
          echo "TEMP=D:\tmp" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Prepare Windows x64 CPU speech runtime
        shell: pwsh
        working-directory: s
        run: |
          .\scripts\prepare-windows-sherpa-runtime.ps1 `
            -Architecture x64 `
            -WorkRoot "D:\sherpa-x64" `
            -LibStageDir "D:\sherpa-x64\install\lib" `
            -RuntimeStageDir "$PWD\src-tauri\windows-runtime"

      - name: Cargo clean (Windows)
        run: |
          $env:CARGO_TARGET_DIR = "D:\t"
          cargo clean --manifest-path s/src-tauri/Cargo.toml
        shell: pwsh

      - name: Fetch Cargo dependencies
        working-directory: s/src-tauri
        run: cargo fetch --target x86_64-pc-windows-msvc
        shell: pwsh

      - name: Verify updater signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Error "TAURI_SIGNING_PRIVATE_KEY is required to publish updater artifacts."
            exit 1
          }

      - name: Build and publish Windows release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUST_BACKTRACE: 1
          CARGO_TARGET_DIR: D:/t
          CARGO_INCREMENTAL: 0
          CARGO_BUILD_JOBS: 1
          SHERPA_ONNX_LIB_DIR: D:/sherpa-x64/install/lib
        with:
          projectPath: s
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "Selah ${{ needs.prepare.outputs.tag }}"
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --features stt-shared,self-updater --config '{"bundle":{"createUpdaterArtifacts":true}}' -- --no-default-features

      - name: Verify Windows updater artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "D:\t\x86_64-pc-windows-msvc\release\bundle\nsis\Selah_${{ needs.prepare.outputs.version }}_x64-setup.exe"
          $sig = "$setup.sig"
          if (-not (Test-Path $setup)) { throw "Missing updater installer: $setup" }
          if (-not (Test-Path $sig)) { throw "Missing updater signature: $sig" }
          if (-not (Test-Path "latest.json")) { throw "Missing latest.json" }
          $feed = Get-Content "latest.json" -Raw | ConvertFrom-Json
          # ARM64 is added by the following release-windows-arm64 job and is
          # validated by verify-updater-release after both Windows jobs finish.
          foreach ($key in @("darwin-aarch64", "darwin-x86_64", "windows-x86_64", "windows-x86_64-nsis")) {
            $item = $feed.platforms.PSObject.Properties[$key].Value
            if (-not $item -or [string]::IsNullOrWhiteSpace($item.url) -or [string]::IsNullOrWhiteSpace($item.signature)) {
              throw "latest.json missing $key url/signature"
            }
          }

  release-windows-arm64:
    needs: [prepare, release-windows]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          path: s

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: s/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Configure ARM64 MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64_arm64

      - name: Apply release version
        working-directory: s
        run: node scripts/apply-version.mjs ${{ needs.prepare.outputs.version }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: s

      - name: Shorten temp paths
        run: |
          New-Item -ItemType Directory -Force -Path "D:\tmp" | Out-Null
          echo "TMP=D:\tmp" >> $env:GITHUB_ENV
          echo "TEMP=D:\tmp" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Verify updater signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Error "TAURI_SIGNING_PRIVATE_KEY is required to publish updater artifacts."
            exit 1
          }

      - name: Prepare Windows ARM64 CPU speech runtime
        shell: pwsh
        working-directory: s
        run: |
          .\scripts\prepare-windows-sherpa-runtime.ps1 `
            -Architecture arm64 `
            -WorkRoot "D:\sherpa-arm64" `
            -LibStageDir "D:\sherpa-arm64\install\lib" `
            -RuntimeStageDir "$PWD\src-tauri\windows-runtime"

      - name: Build and publish Windows ARM64 release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUST_BACKTRACE: 1
          CARGO_TARGET_DIR: D:/t
          CARGO_BUILD_TARGET: aarch64-pc-windows-msvc
          CARGO_INCREMENTAL: 0
          CARGO_BUILD_JOBS: 1
          SHERPA_ONNX_LIB_DIR: D:/sherpa-arm64/install/lib
        with:
          projectPath: s
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "Selah ${{ needs.prepare.outputs.tag }}"
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target aarch64-pc-windows-msvc --features stt-shared,self-updater --config '{"bundle":{"createUpdaterArtifacts":true}}' -- --no-default-features

      - name: Verify Windows ARM64 updater artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "D:\t\aarch64-pc-windows-msvc\release\bundle\nsis\Selah_${{ needs.prepare.outputs.version }}_arm64-setup.exe"
          $sig = "$setup.sig"
          if (-not (Test-Path $setup)) { throw "Missing ARM64 updater installer: $setup" }
          if (-not (Test-Path $sig)) { throw "Missing ARM64 updater signature: $sig" }

  verify-updater-release:
    needs: [prepare, release-windows-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify draft updater feed
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/find-release-by-tag.mjs --tag "${TAG}" --output release.json --required
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const release = JSON.parse(fs.readFileSync("release.json", "utf8"));
          const names = new Set((release.assets || []).map((asset) => asset.name));
          if (!names.has("latest.json")) throw new Error("Release asset latest.json is missing");
          if (![...names].some((name) => name.endsWith(".app.tar.gz.sig"))) {
            throw new Error("macOS updater signature asset is missing");
          }
          if (![...names].some((name) => name.endsWith("-setup.exe.sig"))) {
            throw new Error("Windows updater signature asset is missing");
          }
          const latest = (release.assets || []).find((asset) => asset.name === "latest.json");
          fs.writeFileSync("latest_asset_url.txt", latest.url);
          NODE
          curl -fsSL \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -L "$(cat latest_asset_url.txt)" \
            -o latest.json
          node scripts/reconcile-updater-signatures.mjs --release release.json --latest latest.json --marker needs_reupload

          # Re-upload latest.json if it was patched (delete old asset first, then upload)
          if [ -f needs_reupload ]; then
            release_id=$(node -e 'const fs=require("fs"); console.log(JSON.parse(fs.readFileSync("release.json", "utf8")).id)')
            node scripts/upload-release-asset.mjs --release release.json --expected-release-id "${release_id}" --file latest.json --name latest.json --require-draft
          else
            echo "No re-upload needed"
          fi
