[advisories]
# These exact packages occur only in the Linux GTK3/D-Bus dependency graph.
# Selah ships macOS/Windows; scripts/audit-rust-dependencies.mjs verifies all
# four release graphs before applying these exceptions. Reassess before adding
# Linux support, changing these packages, or upgrading Tauri's Linux backend.
# https://rustsec.org/advisories/RUSTSEC-2024-0370.html (proc-macro-error 1.0.4)
# https://rustsec.org/advisories/RUSTSEC-2024-0429.html (glib 0.18.5)
# The D-Bus helper crates were merged into zbus 6; the old standalone crates
# are marked unmaintained. They are absent from macOS/Windows release graphs.
# https://rustsec.org/advisories/RUSTSEC-2026-0370.html (zvariant 5.15.0)
# https://rustsec.org/advisories/RUSTSEC-2026-0371.html (zbus_names 4.3.4)
# https://rustsec.org/advisories/RUSTSEC-2026-0372.html (zvariant_derive 5.15.0)
ignore = ["RUSTSEC-2024-0370", "RUSTSEC-2024-0429", "RUSTSEC-2026-0370", "RUSTSEC-2026-0371", "RUSTSEC-2026-0372"]

[output]
deny = ["warnings"]
quiet = false
