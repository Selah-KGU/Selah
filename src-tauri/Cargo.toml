[package]
name = "selah-app"
version = "1.1.0"
description = "Selah - 新月の下で、知性を繋ぐ。すべての関学生に。"
authors = ["Selah-KGU"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.99.0"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["stt-shared", "self-updater"]
stt-static = ["sherpa-onnx/static"]
stt-shared = ["sherpa-onnx/shared"]
self-updater = ["tauri-plugin-updater"]
store-build = ["tauri-plugin-updater"]

[build-dependencies]
embed-resource = "3.0.12"
tauri-build = { version = "2.7.3", features = [] }

[dev-dependencies]
tauri = { version = "2.12.4", features = ["test"] }

[dependencies]
serde_json = "1.0.154"
# Avoid the unpatched RSA timing advisory in the alternative rust_crypto backend.
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
log = "0.4.34"
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-log = "2.10.1"
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "json", "native-tls", "multipart", "blocking", "stream", "form", "query", "charset", "http2", "system-proxy"] }
futures-util = "0.3.34"
tokio = { version = "1.53.3", features = ["sync", "time", "macros", "net", "io-util"] }
scraper = "0.27.0"
regex = "1.13.1"
unicode-segmentation = "1.13.3"
unicode-normalization = "0.1.25"
base64 = "0.23.1"
url = "2.5.8"
urlencoding = "2.1.3"
dirs = "7.0.0"
lopdf = "0.45.0"
pdfium-render = "0.9.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
cookie_store = "0.22.1"
reqwest_cookie_store = "0.10.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.28.0", features = ["v4"] }
rand = "0.10.3"
sha2 = "0.11.1"
hex = "0.4.3"
aes-gcm = "0.11.1"
cpal = "0.18.2"
bzip2 = "0.6.1"
tar = "0.4.46"
time = { version = "0.3.55", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-updater = { version = "2.14.0", optional = true }
rfd = "0.17.2"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
flate2 = "1.1.10"

[target.'cfg(not(target_os = "windows"))'.dependencies]
sherpa-onnx = { version = "=1.13.8", default-features = false }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-notification = "2.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-user-notifications = "0.3.2"
objc2-app-kit = { version = "0.3.2", features = [
  "NSApplication",
  "NSAppearance",
  "NSAttributedString",
  "NSButton",
  "NSColor",
  "NSEvent",
  "NSGraphics",
  "NSImage",
  "NSPanel",
  "NSParagraphStyle",
  "NSResponder",
  "NSSharingService",
  "NSScreen",
  "NSTextField",
  "NSView",
  "NSVisualEffectView",
  "NSWindow"
] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer", "CAShapeLayer", "CAGradientLayer"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGPath", "CGBase"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSHTTPCookie", "NSArray", "NSString", "NSAttributedString", "NSDictionary", "NSValue", "NSURL", "NSBundle", "NSNotification", "NSDistributedNotificationCenter"] }
objc2-web-kit = { version = "0.3.2", features = ["WKWebsiteDataStore", "WKHTTPCookieStore", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = "4.2.0"
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = [
  "ApplicationModel_DataTransfer",
  "Foundation",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_WinRT",
  "Win32_UI_Shell"
] }
# These COM types must match windows and webview2-com, rather than 0.100.x.
windows-collections = "0.3.2"
windows-core = "0.62.2"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }
tauri-plugin-single-instance = "2.5.4"
sherpa-onnx = { version = "=1.13.8", default-features = false }

[profile.dev]
# Keep dev builds non-incremental to avoid the macOS native agent panel
# compiler ICE observed with earlier toolchains.
incremental = false

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
# `panic = "abort"` is intentionally NOT set. tao/tauri use `catch_unwind` to
# recover from panics in the event loop, and our `RunEvent::Exit` handler is
# itself wrapped in `catch_unwind` (it runs inside macOS
# `applicationWillTerminate`, an extern "C" callback — an escaping panic there
# aborts the process). Under `panic = "abort"` those guards are no-ops.
